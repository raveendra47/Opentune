# Every push and pull request: build, unit tests, lint, and the shrunk
# release APKs, so a change that breaks any of them shows up here first.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The streaming side's own backend (usage counters and the lossless add-on service):
      # its node tests come red from upstream itself, and this fork is local-only, so the
      # whole step — and the Hostinger package of the same service — is out.
      # Was: node --test usage-api/worker.test.mjs addons.test.mjs dashboard/model.test.mjs
      #      examples/audio-addon/worker.test.mjs … + services/lossless-addon pack.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      # A fork's own signing key, when its secrets are set; the release APKs in
      # the apks artifact are then signed with it. Without it they stay
      # debug-signed (a runner key that differs between runs).
      - name: Keystore (when the signing secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing keystore secret: release APKs stay debug-signed."
          fi

      - name: Build, unit tests and lint
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Release build (R8 shrinking)
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
            core/build/reports/
            core/build/test-results/
            wear/build/reports/
            wear/build/test-results/
            wear/build/screenshots/
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk

  # The desktop app: its tests, and an installer for each system.
  # This fork ships the Android app only — the desktop port stays upstream. `if: false`
  # takes the mac/linux/win runners out of every push; delete the line to bring them back.
  desktop:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: :desktop:packageDeb :desktop:packageRpm
          - os: windows-latest
            package: :desktop:packageMsi :desktop:packageExe
          - os: macos-latest
            package: :desktop:packageDmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The build includes the Android modules, which need the SDK to configure.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      # jpackage builds the .rpm with the system's own rpmbuild.
      - name: RPM tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Desktop tests and installers
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
        run: ./gradlew --no-daemon :desktop:test ${{ matrix.package }}
      # The packaged app on its own trimmed runtime: FFmpeg, GraalJS and SQLite must load there too.
      - name: Packaged app self-check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./gradlew --no-daemon :desktop:createDistributable
          app=desktop/build/compose/binaries/main/app
          if [ -d "$app/OpenTune.app" ]; then "$app/OpenTune.app/Contents/MacOS/OpenTune" --self-check; else "$app/OpenTune/bin/OpenTune" --self-check; fi
      # One file that runs on any Linux after chmod +x, wrapped around the app image just checked.
      - name: AppImage
        if: runner.os == 'Linux'
        run: desktop/packaging/appimage.sh desktop/build/compose/binaries/main/app/OpenTune desktop/build/compose/binaries/main/appimage/OpenTune-x86_64.AppImage
      # Unzip anywhere and run OpenTune.exe: the app image, zipped.
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew --no-daemon :desktop:createDistributable
          New-Item -ItemType Directory -Force desktop/build/compose/binaries/main/portable | Out-Null
          Compress-Archive -Path desktop/build/compose/binaries/main/app/OpenTune -DestinationPath desktop/build/compose/binaries/main/portable/OpenTune-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            desktop/build/compose/binaries/main/appimage/*.AppImage
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/portable/*.zip
            desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  # The marketing site's own checks (its playwright chromium download flakes, and the
  # site isn't published from this fork). Delete the line to bring the checks back.
  website:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check-distribution.py
      - run: python scripts/check-social-preview.py
      - run: node --test scripts/check-spotify-callback.cjs
      - run: python scripts/prepare-usage-assets.py
      - run: python scripts/check-app-controls.py
      - run: python scripts/check-website.py
      - run: python scripts/check-room-invite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-reports
          path: website-reports/
