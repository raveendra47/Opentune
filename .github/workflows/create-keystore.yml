# One-time helper for a fork's own maintainer: generate a permanent signing
# keystore and show it base64-encoded, to be stored in the repository secrets.
# Also prints the signing certificate's SHA-256 fingerprint, for
# OPENTUNE_CERT_SHA256. Runs only when asked, from Actions → Create signing
# keystore.
#
# Before running, set:
#   OPENTUNE_KEYSTORE_PASSWORD   a passphrase you invent, 16 characters or more
#   OPENTUNE_KEY_ALIAS           opentune
#   OPENTUNE_KEY_PASSWORD        the same passphrase
# The keystore and its password never appear together: the keystore alone is
# inert without the password, which is only known from your secrets.
#
# Delete this file once your secrets are stored.
name: Create signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the secrets are set
        env:
          STORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
          ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || { echo '::error::Set OPENTUNE_KEYSTORE_PASSWORD in Settings → Secrets → Actions first (invent a passphrase, 16 characters or more).'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo '::error::Set OPENTUNE_KEY_PASSWORD (use the same passphrase).'; exit 1; }
          test -n "$ALIAS" || { echo '::error::Set OPENTUNE_KEY_ALIAS (opentune).'; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate the keystore
        env:
          STORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
          ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore opentune.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=OpenTune Personal, OU=Personal, O=OpenTune, L=Local, ST=Local, C=IN"

      - name: Signing certificate fingerprint
        env:
          STORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
        run: |
          keytool -list -keystore opentune.keystore -alias "$ALIAS" -storepass "$STORE_PASSWORD" |
            grep 'SHA-256 digest:'

      - name: Keystore as base64
        env:
          STORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
        run: |
          echo "Copy the line below into the OPENTUNE_KEYSTORE_BASE64 secret. It is inert without your password."
          echo "-----"
          base64 opentune.keystore | tr -d '\n'
          echo
          echo "-----"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: opentune.keystore
          if-no-files-found: error
